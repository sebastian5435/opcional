spring.application.name=superventas
server.port=8080

# --- H2 en memoria (SOLO desarrollo / prototipo) ---
spring.datasource.url=jdbc:h2:mem:superventas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:superventas).
# Desactivar en cualquier entorno distinto al local.
spring.h2.console.enabled=true

# Errores sin trazas hacia el cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Datos de prueba y CORS
app.seed.enabled=true
app.cors.allowed-origins=http://localhost:5173
